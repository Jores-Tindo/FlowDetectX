name: flowdetectx
description: FlowDetectX - Détection de transactions suspectes dans les IMF béninoises
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # State management
  provider: ^6.1.0

  flutter_localizations:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.67.0
  data_table_2: ^2.5.12
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  window_manager: ^0.3.8


  # Export
  printing: ^5.10.0
  archive: ^3.3.5
  pdf: ^3.10.8
  csv: ^6.0.0
  excel: ^4.0.2
  path_provider: ^2.1.2
  path: ^1.8.3
  open_filex: ^4.3.4
  permission_handler: ^11.3.0
  file_selector: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pictures/